<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Master v7 - Pro Trainer</title>
    <style>
        :root { --bg: #0b0e14; --card: #1c2128; --txt: #adbac7; --accent: #3fb950; --judo: #2f81f7; --danger: #f85149; --gold: #f1e05a; }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; padding: 15px; padding-bottom: 80px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #161b22; padding: 5px; border-radius: 12px; position: sticky; top: 10px; z-index: 100; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: var(--txt); font-weight: bold; font-size: 0.7em; }
        .tab-btn.active { background: var(--card); color: white; border: 1px solid var(--judo); }
        .panel { display: none; background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid #30363d; margin-bottom: 20px; }
        
        /* Checklist y Rutina */
        .routine-item { background: #0d1117; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--judo); display: flex; justify-content: space-between; align-items: center; }
        .warning { background: rgba(248, 81, 73, 0.1); color: var(--danger); padding: 10px; border-radius: 8px; border: 1px solid var(--danger); margin-bottom: 15px; font-size: 0.8em; display: none; }
        
        /* Cards con Imagen */
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #30363d; margin-bottom: 15px; }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #000; }
        .card-content { padding: 15px; }
        
        button.main { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-acc { background: var(--accent); color: white; }
        #timerDisplay { font-size: 3.5em; text-align: center; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('salud', this)">BIBLIOTECA</button>
        <button class="tab-btn" onclick="switchTab('rutina', this)">MI RUTINA</button>
        <button class="tab-btn" onclick="switchTab('judo', this)">JUDO 📹</button>
        <button class="tab-btn" onclick="switchTab('reloj', this)">RELOJ</button>
    </div>

    <div id="alertBox" class="warning">⚠️ ALERTA DE SOBRECARGA: Demasiada carga en zona lumbar.</div>

    <div id="rutinaPanel" class="panel">
        <h4 style="margin:0">Checklist del Día</h4>
        <div id="routineList" style="margin-top:15px"></div>
        <button class="main" style="background:var(--judo); color:white" onclick="analizarSobrecarga()">Analizar Balance de Carga</button>
    </div>

    <div id="relojPanel" class="panel">
        <div id="timerDisplay">00:20</div>
        <div style="display:flex; gap:5px">
            <button class="main btn-acc" onclick="startTabata()">PLAY</button>
            <button class="main" style="background:var(--danger); color:white" onclick="stopTabata()">STOP</button>
            <button class="main" style="background:#444; color:white" onclick="resetTabata()">RESET</button>
        </div>
    </div>

    <div id="judoPanel" class="panel">
        <input type="file" id="videoInput" accept="video/*" style="width:100%; margin-bottom:10px">
        <video id="videoPlayer" controls style="width:100%; border-radius:8px"></video>
        <button class="main" style="background:var(--judo); color:white" onclick="document.getElementById('videoPlayer').playbackRate = 0.5">Slow Motion</button>
    </div>

    <div id="content"></div>

    <button class="main" style="background:transparent; color:#555; font-size:0.7em" onclick="checkMaster()">Acceso Maestro</button>

    <div id="masterPanel" class="panel" style="margin-top:20px">
        <textarea id="jsonInput" rows="3" style="width:100%; background:#000; color:#fff" placeholder="Pegar JSON con 'imagen': 'url'"></textarea>
        <button class="main btn-acc" onclick="importarJSON()">Cargar Ejercicio</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('dojo_db')) || [];
        let miRutina = JSON.parse(localStorage.getItem('mi_rutina')) || [];
        let timerInterval, tWork = 20;

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            document.getElementById(tab + 'Panel') ? document.getElementById(tab + 'Panel').style.display = 'block' : null;
            document.getElementById('content').style.display = (tab === 'salud') ? 'block' : 'none';
            render();
            if(tab === 'rutina') renderRutina();
        }

        function resetTabata() { stopTabata(); document.getElementById('timerDisplay').innerText = "00:20"; }

        function checkMaster() { if(prompt("Pass:") === "JUDO2026") document.getElementById('masterPanel').style.display = 'block'; }

        function importarJSON() {
            const data = JSON.parse(document.getElementById('jsonInput').value);
            db = [...db, ...(Array.isArray(data) ? data : [data])];
            localStorage.setItem('dojo_db', JSON.stringify(db));
            render();
        }

        function agregarARutina(idx) {
            const series = prompt("¿Series?", "3");
            const reps = prompt("¿Repeticiones?", "12");
            miRutina.push({...db[idx], series, reps, hecha: false});
            localStorage.setItem('mi_rutina', JSON.stringify(miRutina));
            alert("Añadido a tu rutina diaria");
        }

        function renderRutina() {
            const list = document.getElementById('routineList');
            list.innerHTML = '';
            miRutina.forEach((item, i) => {
                list.innerHTML += `
                    <div class="routine-item" style="opacity: ${item.hecha ? '0.5' : '1'}">
                        <div>
                            <strong>${item.titulo}</strong><br>
                            <small>${item.series} series x ${item.reps} reps</small>
                        </div>
                        <input type="checkbox" ${item.hecha ? 'checked' : ''} onclick="marcarHecho(${i})">
                    </div>`;
            });
        }

        function marcarHecho(i) {
            miRutina[i].hecha = !miRutina[i].hecha;
            localStorage.setItem('mi_rutina', JSON.stringify(miRutina));
            renderRutina();
        }

        function analizarSobrecarga() {
            const tags = miRutina.flatMap(item => item.tags);
            const conteo = {};
            tags.forEach(t => conteo[t] = (conteo[t] || 0) + 1);
            
            const alertBox = document.getElementById('alertBox');
            if(conteo['Lumbar'] > 2 || conteo['Hombro'] > 3) {
                alertBox.innerText = "⚠️ RIESGO: Tienes muchos ejercicios de " + (conteo['Lumbar'] > 2 ? 'Lumbar' : 'Hombro') + ". Cambia uno por movilidad o descanso.";
                alertBox.style.display = 'block';
            } else {
                alertBox.innerText = "✅ Rutina Balanceada. ¡Buen entrenamiento!";
                alertBox.style.display = 'block';
                alertBox.style.color = 'var(--accent)';
                alertBox.style.borderColor = 'var(--accent)';
            }
        }

        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            db.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.imagen || 'https://via.placeholder.com/400x200?text=Judo+Pro'}" alt="ejercicio">
                    <div class="card-content">
                        <h3>${item.titulo}</h3>
                        <p style="font-size:0.8em">${item.tecnica}</p>
                        <button class="main btn-acc" onclick="agregarARutina(${idx})">+ Agregar a mi Día</button>
                    </div>`;
                container.appendChild(card);
            });
        }

        // Lógica de cronómetro simplificada para el ejemplo
        function startTabata() { 
            let t = 20; 
            timerInterval = setInterval(() => { 
                t--; 
                document.getElementById('timerDisplay').innerText = `00:${t.toString().padStart(2, '0')}`;
                if(t<=0) clearInterval(timerInterval);
            }, 1000); 
        }
        function stopTabata() { clearInterval(timerInterval); }

        render();
    </script>
</body>
</html>
