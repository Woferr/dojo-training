<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Master v3</title>
    <style>
        :root { --bg: #0b0e14; --card: #1c2128; --txt: #adbac7; --accent: #3fb950; --judo: #2f81f7; --danger: #f85149; --gold: #f1e05a; }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; padding: 15px; }
        h2 { text-align: center; color: white; text-transform: uppercase; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #161b22; padding: 5px; border-radius: 12px; font-size: 0.8em; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: var(--txt); cursor: pointer; }
        .tab-btn.active { background: var(--card); color: white; border: 1px solid var(--judo); }
        .panel { display: none; background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #30363d; }
        #timerDisplay { font-size: 4em; font-weight: 800; color: var(--accent); text-align: center; }
        .card { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid #30363d; }
        .section-title { font-size: 0.7em; text-transform: uppercase; color: #768390; margin-top: 10px; display: block; font-weight: bold; }
        .med-note { color: #85e89d; background: rgba(46,160,67,0.1); padding: 8px; border-radius: 8px; border-left: 3px solid var(--accent); }
        .judo-note { color: #79c0ff; background: rgba(56,139,253,0.1); padding: 8px; border-radius: 8px; border-left: 3px solid var(--judo); }
        button.main { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-acc { background: var(--accent); color: white; }
        video { width: 100%; border-radius: 12px; margin-top: 10px; background: #000; }
    </style>
</head>
<body>
    <h2>🥋 Dojo Master v3</h2>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('salud', this)">Salud</button>
        <button class="tab-btn" onclick="switchTab('judo', this)">Judo</button>
        <button class="tab-btn" onclick="switchTab('reloj', this)">Cronómetro</button>
    </div>

    <div id="relojPanel" class="panel">
        <div id="statusDisplay" style="text-align:center; color:var(--gold)">TABATA READY</div>
        <div id="timerDisplay">00:20</div>
        <button class="main btn-acc" onclick="startTabata()">INICIAR</button>
        <button class="main" style="background:var(--danger); color:white" onclick="stopTabata()">PARAR</button>
    </div>

    <div id="judoCamPanel" class="panel">
        <h4 style="margin:0">Cámara Técnica (Análisis 0.5x)</h4>
        <input type="file" id="videoInput" accept="video/*" style="margin-top:10px">
        <video id="videoPlayer" controls></video>
        <button class="main" style="background:var(--judo); color:white" onclick="slowMo()">MODO CÁMARA LENTA</button>
    </div>

    <div id="masterPanel" class="panel">
        <textarea id="jsonInput" rows="3" style="width:100%; background:#000; color:#fff" placeholder="Pegar JSON..."></textarea>
        <button class="main btn-acc" onclick="importarJSON()">Cargar</button>
    </div>

    <div id="content"></div>
    <button class="main" style="background:transparent; color:#555" onclick="checkMaster()">Acceso Maestro</button>

    <script>
        let db = JSON.parse(localStorage.getItem('dojo_db')) || [];
        let currentTab = 'salud', isMaster = false, timerInterval;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            if(tab === 'reloj') document.getElementById('relojPanel').style.display = 'block';
            if(tab === 'judo') document.getElementById('judoCamPanel').style.display = 'block';
            render();
        }

        // --- Lógica Video ---
        document.getElementById('videoInput').onchange = function(e) {
            const file = e.target.files[0];
            document.getElementById('videoPlayer').src = URL.createObjectURL(file);
        };
        function slowMo() { 
            const v = document.getElementById('videoPlayer');
            v.playbackRate = (v.playbackRate === 1) ? 0.5 : 1;
            alert("Velocidad: " + v.playbackRate + "x");
        }

        // --- Lógica Reloj ---
        function beep(f, d) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = f; g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
            o.start(); o.stop(audioCtx.currentTime + d);
        }
        function startTabata() {
            let r = 8, w = true, t = 20;
            clearInterval(timerInterval); beep(600, 0.5);
            timerInterval = setInterval(() => {
                t--;
                if(t <= 0) {
                    if(w) { w = false; t = 10; r--; beep(400, 0.5); if(r <= 0) { clearInterval(timerInterval); return; } }
                    else { w = true; t = 20; beep(800, 0.5); }
                }
                document.getElementById('timerDisplay').innerText = `00:${t.toString().padStart(2, '0')}`;
                document.getElementById('statusDisplay').innerText = w ? `TRABAJO (${r})` : "DESCANSO";
            }, 1000);
        }
        function stopTabata() { clearInterval(timerInterval); }

        function checkMaster() { if(prompt("Pass:") === "JUDO2026") { isMaster = true; document.getElementById('masterPanel').style.display = 'block'; render(); } }
        function importarJSON() {
            const data = JSON.parse(document.getElementById('jsonInput').value);
            db = [...db, ...(Array.isArray(data) ? data : [data])];
            localStorage.setItem('dojo_db', JSON.stringify(db));
            render();
        }
        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            db.filter(item => {
                const cat = item.categoria.toLowerCase();
                if(currentTab === 'salud') return cat.includes('salud');
                if(currentTab === 'judo') return cat.includes('dojo') || cat.includes('judo');
                return false;
            }).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${item.titulo}</h3><p>${item.tecnica}</p>
                    <span class="section-title">Médico:</span><p class="med-note">${item.consejo_medico}</p>
                    <span class="section-title">Judo:</span><p class="judo-note">${item.aplicacion_judo}</p>`;
                container.appendChild(card);
            });
        }
        render();
    </script>
</body>
</html>
