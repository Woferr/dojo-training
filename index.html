<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Training & Health</title>
    <style>
    <style>
    :root { 
        --bg: #0b0e14; 
        --card: #1c2128; 
        --txt: #adbac7; 
        --accent: #3fb950; /* Verde Salud */
        --judo: #2f81f7;   /* Azul Judo */
        --danger: #f85149;
        --gold: #f1e05a;
    }
    body { 
        background: var(--bg); 
        color: var(--txt); 
        font-family: 'Segoe UI', Roboto, sans-serif; 
        margin: 0; padding: 15px;
        line-height: 1.6;
    }
    h2 { text-align: center; color: white; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 30px; }
    
    /* Botones de Pestañas con Efecto */
    .tabs { display: flex; gap: 10px; margin-bottom: 25px; background: #161b22; padding: 5px; border-radius: 12px; }
    .tab-btn { 
        flex: 1; padding: 12px; border: none; border-radius: 8px; 
        background: transparent; color: var(--txt); font-weight: bold; 
        transition: 0.3s; cursor: pointer;
    }
    .tab-btn.active { background: var(--card); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

    /* Tarjetas con profundidad */
    .card { 
        background: var(--card); border-radius: 16px; padding: 20px; 
        margin-bottom: 20px; border: 1px solid #30363d; 
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }
    .card:active { transform: scale(0.98); }
    .card h3 { margin: 0 0 10px 0; color: white; font-size: 1.4em; }
    
    /* Tags y Notas */
    .tag { background: rgba(63, 185, 80, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.7em; border: 1px solid var(--accent); margin-right: 5px; }
    .section-title { font-size: 0.8em; text-transform: uppercase; color: #768390; margin-top: 15px; display: block; font-weight: 800; }
    .med-note { color: #85e89d; background: rgba(46, 160, 67, 0.1); padding: 10px; border-radius: 8px; border-left: 4px solid var(--accent); }
    .judo-note { color: #79c0ff; background: rgba(56, 139, 253, 0.1); padding: 10px; border-radius: 8px; border-left: 4px solid var(--judo); }

    /* Inputs y Botones Admin */
    button.main { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 800; font-size: 1em; margin-top: 15px; transition: 0.3s; }
    .btn-acc { background: linear-gradient(135deg, #238636, #2ea043); color: white; }
    .btn-master { background: #21262d; color: #8b949e; border: 1px solid #30363d; margin-top: 50px; }
</style>


    <div id="masterPanel">
        <h4 style="margin:0 0 10px 0">Panel Maestro</h4>
        <textarea id="jsonInput" rows="5" placeholder="Pega el JSON de los agentes aquí..."></textarea>
        <button class="main btn-acc" onclick="importarJSON()">Cargar Conocimiento</button>
    </div>

    <div id="content"></div>

    <button class="main btn-master" onclick="checkMaster()">Acceso Maestro</button>

    <script>
        let db = JSON.parse(localStorage.getItem('dojo_db')) || [];
        let currentTab = 'salud';
        const MASTER_KEY = "JUDO2026";
        let isMaster = false;

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function checkMaster() {
            const p = prompt("Introduce Passcode Maestro:");
            if(p === MASTER_KEY) {
                isMaster = true;
                document.getElementById('masterPanel').style.display = 'block';
                render();
                alert("Perfil Maestro Activado");
            }
        }

        function importarJSON() {
            try {
                const data = JSON.parse(document.getElementById('jsonInput').value);
                const arrayData = Array.isArray(data) ? data : [data];
                db = [...db, ...arrayData];
                localStorage.setItem('dojo_db', JSON.stringify(db));
                document.getElementById('jsonInput').value = '';
                render();
            } catch(e) { alert("Error en el formato JSON"); }
        }

        function borrarItem(index) {
            if(confirm("¿Eliminar este ejercicio?")) {
                db.splice(index, 1);
                localStorage.setItem('dojo_db', JSON.stringify(db));
                render();
            }
        }

        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            
            const filtered = db.filter(item => {
                if(currentTab === 'salud') return item.categoria.toLowerCase().includes('salud');
                return item.categoria.toLowerCase().includes('dojo') || item.categoria.toLowerCase().includes('judo');
            });

            filtered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${item.titulo}</h3>
                    ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    <span class="section-title">Técnica:</span>
                    <p style="margin:5px 0">${item.tecnica}</p>
                    <span class="section-title">Traumatólogo (Core/Fascia/Artic.):</span>
                    <p class="med-note" style="margin:5px 0">${item.consejo_medico}</p>
                    <span class="section-title">Aplicación Judo:</span>
                    <p class="judo-note" style="margin:5px 0">${item.aplicacion_judo}</p>
                    <div class="admin-controls" style="display: ${isMaster ? 'block' : 'none'}">
                        <button onclick="borrarItem(${db.indexOf(item)})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.8em">Eliminar Ficha</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        render();
    </script>
</body>
  
</html>
