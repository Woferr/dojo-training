<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Training & Health</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --txt: #c9d1d9; --accent: #238636; --judo: #1f6feb; --danger: #da3633; }
        body { background: var(--bg); color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 15px; }
        h2 { text-align: center; color: var(--txt); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: var(--card); color: var(--txt); font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: white; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #30363d; position: relative; }
        .card h3 { margin-top: 0; color: #58a6ff; }
        .tag { display: inline-block; background: #21262d; padding: 4px 8px; border-radius: 5px; font-size: 0.75em; margin-right: 5px; }
        .section-title { font-size: 0.9em; font-weight: bold; margin-top: 10px; display: block; }
        .med-note { color: #aff5b4; font-style: italic; }
        .judo-note { color: #a5d6ff; }
        .admin-controls { display: none; margin-top: 10px; border-top: 1px solid #30363d; pt: 10px; }
        #masterPanel { display: none; background: #21262d; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed var(--accent); }
        button.main { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-acc { background: var(--accent); color: white; }
        .btn-master { background: #30363d; color: #8b949e; font-size: 0.8em; margin-top: 40px; }
        textarea { width: 100%; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 5px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>🥋 Dojo Training</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('salud')">Salud & Core</button>
        <button class="tab-btn" onclick="switchTab('judo')">Modo Dojo</button>
    </div>

    <div id="masterPanel">
        <h4 style="margin:0 0 10px 0">Panel Maestro</h4>
        <textarea id="jsonInput" rows="5" placeholder="Pega el JSON de los agentes aquí..."></textarea>
        <button class="main btn-acc" onclick="importarJSON()">Cargar Conocimiento</button>
    </div>

    <div id="content"></div>

    <button class="main btn-master" onclick="checkMaster()">Acceso Maestro</button>

    <script>
        let db = JSON.parse(localStorage.getItem('dojo_db')) || [];
        let currentTab = 'salud';
        const MASTER_KEY = "JUDO2026";
        let isMaster = false;

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function checkMaster() {
            const p = prompt("Introduce Passcode Maestro:");
            if(p === MASTER_KEY) {
                isMaster = true;
                document.getElementById('masterPanel').style.display = 'block';
                render();
                alert("Perfil Maestro Activado");
            }
        }

        function importarJSON() {
            try {
                const data = JSON.parse(document.getElementById('jsonInput').value);
                const arrayData = Array.isArray(data) ? data : [data];
                db = [...db, ...arrayData];
                localStorage.setItem('dojo_db', JSON.stringify(db));
                document.getElementById('jsonInput').value = '';
                render();
            } catch(e) { alert("Error en el formato JSON"); }
        }

        function borrarItem(index) {
            if(confirm("¿Eliminar este ejercicio?")) {
                db.splice(index, 1);
                localStorage.setItem('dojo_db', JSON.stringify(db));
                render();
            }
        }

        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            
            const filtered = db.filter(item => {
                if(currentTab === 'salud') return item.categoria.toLowerCase().includes('salud');
                return item.categoria.toLowerCase().includes('dojo') || item.categoria.toLowerCase().includes('judo');
            });

            filtered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${item.titulo}</h3>
                    ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    <span class="section-title">Técnica:</span>
                    <p style="margin:5px 0">${item.tecnica}</p>
                    <span class="section-title">Traumatólogo (Core/Fascia/Artic.):</span>
                    <p class="med-note" style="margin:5px 0">${item.consejo_medico}</p>
                    <span class="section-title">Aplicación Judo:</span>
                    <p class="judo-note" style="margin:5px 0">${item.aplicacion_judo}</p>
                    <div class="admin-controls" style="display: ${isMaster ? 'block' : 'none'}">
                        <button onclick="borrarItem(${db.indexOf(item)})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.8em">Eliminar Ficha</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        render();
    </script>
</body>
  
</html>
