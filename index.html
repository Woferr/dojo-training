<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Master Pro v8</title>
    <style>
        :root { --bg: #0b0e14; --card: #1c2128; --txt: #adbac7; --accent: #3fb950; --judo: #2f81f7; --danger: #f85149; --gold: #f1e05a; }
        body { background: var(--bg); color: var(--txt); font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 50px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #161b22; padding: 5px; border-radius: 12px; position: sticky; top: 10px; z-index: 100; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: var(--txt); font-weight: bold; font-size: 0.75em; cursor: pointer; }
        .tab-btn.active { background: var(--card); color: white; border: 1px solid var(--judo); }
        .panel { display: none; background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid #30363d; margin-bottom: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid #30363d; margin-bottom: 15px; }
        .card h3 { margin: 0; color: white; font-size: 1.2em; display: flex; align-items: center; gap: 8px; }
        .muscle-tag { color: var(--gold); font-size: 0.8em; font-weight: bold; text-transform: uppercase; margin-top: 5px; display: block; }
        .agent-note { font-size: 0.85em; padding: 8px; border-radius: 6px; margin-top: 10px; }
        .med { background: rgba(63, 185, 80, 0.1); border-left: 3px solid var(--accent); color: #aff5b4; }
        .sensei { background: rgba(47, 129, 247, 0.1); border-left: 3px solid var(--judo); color: #a5d6ff; }
        #timerDisplay { font-size: 4em; text-align: center; font-weight: 800; color: var(--accent); margin: 10px 0; font-variant-numeric: tabular-nums; }
        .routine-item { background: #0d1117; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        button.main { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-acc { background: var(--accent); color: white; }
        .warning-box { background: rgba(248,81,73,0.1); color: var(--danger); border: 1px solid var(--danger); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85em; display: none; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('salud', this)">BIBLIOTECA</button>
        <button class="tab-btn" onclick="switchTab('rutina', this)">MI DÍA</button>
        <button class="tab-btn" onclick="switchTab('reloj', this)">RELOJ</button>
        <button class="tab-btn" onclick="switchTab('judo', this)">VIDEO 📹</button>
    </div>

    <div id="alertBox" class="warning-box"></div>

    <div id="rutinaPanel" class="panel">
        <h4 style="margin:0">📋 Checklist de Entrenamiento</h4>
        <div id="routineList" style="margin: 20px 0;"></div>
        <button class="main" style="background:var(--judo); color:white" onclick="analizarSobrecarga()">ANALIZAR FATIGA</button>
    </div>

    <div id="relojPanel" class="panel">
        <div style="display: flex; gap: 10px; margin-bottom: 15px; font-size: 0.8em;">
            <div style="flex:1">Rondas: <input id="inpR" type="number" value="8" style="width:100%; background:#000; color:white; border:1px solid #444; border-radius:4px"></div>
            <div style="flex:1">Trabajo: <input id="inpW" type="number" value="20" style="width:100%; background:#000; color:white; border:1px solid #444; border-radius:4px"></div>
            <div style="flex:1">Pausa: <input id="inpP" type="number" value="10" style="width:100%; background:#000; color:white; border:1px solid #444; border-radius:4px"></div>
        </div>
        <div id="statusT" style="text-align:center; color:var(--gold); font-weight:bold">LISTO</div>
        <div id="timerDisplay">00:20</div>
        <div style="display:flex; gap:5px">
            <button class="main btn-acc" onclick="startT()">PLAY</button>
            <button class="main" style="background:var(--danger); color:white" onclick="stopT()">STOP</button>
            <button class="main" style="background:#444; color:white" onclick="resetT()">RESET</button>
        </div>
    </div>

    <div id="judoPanel" class="panel">
        <input type="file" id="videoInput" accept="video/*" style="width:100%; margin-bottom:10px; font-size:0.8em">
        <video id="videoPlayer" controls style="width:100%; border-radius:8px; background:#000"></video>
        <button class="main" style="background:var(--judo); color:white" onclick="document.getElementById('videoPlayer').playbackRate = 0.5">SLOW MOTION (0.5x)</button>
    </div>

    <div id="content"></div>

    <button class="main" style="background:transparent; color:#555; font-size:0.7em; margin-top:40px" onclick="checkM()">[ Acceso Maestro ]</button>
    <div id="masterPanel" class="panel" style="margin-top:10px">
        <textarea id="jsonIn" rows="4" style="width:100%; background:#000; color:#fff; font-family:monospace; font-size:0.8em" placeholder="Pega el JSON aquí..."></textarea>
        <button class="main btn-acc" onclick="importJ()">IMPORTAR EJERCICIOS</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('dojo_db')) || [];
        let rutina = JSON.parse(localStorage.getItem('mi_rutina')) || [];
        let timer = null;
        const audio = new (window.AudioContext || window.webkitAudioContext)();

        function beep(f, d) {
            if(audio.state === 'suspended') audio.resume();
            const o = audio.createOscillator(), g = audio.createGain();
            o.connect(g); g.connect(audio.destination);
            o.frequency.value = f; g.gain.exponentialRampToValueAtTime(0.00001, audio.currentTime + d);
            o.start(); o.stop(audio.currentTime + d);
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            const target = document.getElementById(tab + 'Panel');
            if(target) target.style.display = 'block';
            document.getElementById('content').style.display = (tab === 'salud') ? 'block' : 'none';
            if(tab === 'salud') renderDB();
            if(tab === 'rutina') renderRutina();
        }

        function startT() {
            clearInterval(timer);
            let r = parseInt(document.getElementById('inpR').value);
            let work = parseInt(document.getElementById('inpW').value);
            let pause = parseInt(document.getElementById('inpP').value);
            let isW = true, t = work;
            beep(600, 0.4);
            timer = setInterval(() => {
                t--;
                if(t <= 0) {
                    if(isW) { 
                        isW = false; t = pause; r--; beep(400, 0.4);
                        if(r <= 0) { clearInterval(timer); document.getElementById('statusT').innerText = "FIN"; return; }
                    } else { isW = true; t = work; beep(800, 0.4); }
                }
                document.getElementById('timerDisplay').innerText = `00:${t.toString().padStart(2, '0')}`;
                document.getElementById('statusT').innerText = isW ? `TRABAJO (${r})` : "DESCANSO";
            }, 1000);
        }
        function stopT() { clearInterval(timer); beep(200, 0.2); document.getElementById('statusT').innerText = "PAUSA"; }
        function resetT() { stopT(); document.getElementById('timerDisplay').innerText = "00:20"; }

        function checkM() { if(prompt("Pass:") === "JUDO2026") document.getElementById('masterPanel').style.display = 'block'; }

        function importJ() {
            try {
                const data = JSON.parse(document.getElementById('jsonIn').value);
                db = [...db, ...(Array.isArray(data) ? data : [data])];
                localStorage.setItem('dojo_db', JSON.stringify(db));
                document.getElementById('jsonIn').value = '';
                renderDB();
                alert("Cargado correctamente");
            } catch(e) { alert("Error en JSON"); }
        }

        function addR(idx) {
            const ej = db[idx];
            if(rutina.some(r => r.titulo === ej.titulo)) return alert("Este ejercicio ya está en tu lista de hoy.");
            const s = prompt("Series:", "3"), r = prompt("Reps:", "12");
            rutina.push({...ej, series: s, reps: r, done: false});
            localStorage.setItem('mi_rutina', JSON.stringify(rutina));
            alert("Añadido a Mi Día");
        }

        function renderDB() {
            const cont = document.getElementById('content');
            cont.innerHTML = '';
            db.forEach((item, i) => {
                cont.innerHTML += `
                    <div class="card">
                        <h3>🥋 ${item.titulo}</h3>
                        <span class="muscle-tag">📍 Músculo: ${item.tags[0]}</span>
                        <p style="font-size:0.9em; margin:10px 0">${item.tecnica}</p>
                        <div class="agent-note med">🦴 <strong>Traumatólogo:</strong> ${item.consejo_medico}</div>
                        <div class="agent-note sensei">🎎 <strong>Sensei:</strong> ${item.aplicacion_judo}</div>
                        <button class="main btn-acc" onclick="addR(${i})">+ AGREGAR A MI DÍA</button>
                        <button onclick="borrarDB(${i})" style="background:none; border:none; color:var(--danger); font-size:0.7em; margin-top:10px; width:100%">[ Eliminar de biblioteca ]</button>
                    </div>`;
            });
        }

        function renderRutina() {
            const list = document.getElementById('routineList');
            list.innerHTML = rutina.length ? '' : '<p style="text-align:center; color:#555">No hay ejercicios hoy.</p>';
            rutina.forEach((item, i) => {
                list.innerHTML += `
                    <div class="routine-item" style="opacity:${item.done ? '0.4' : '1'}">
                        <div onclick="toggleDone(${i})" style="flex:1">
                            <strong style="color:${item.done ? 'var(--accent)' : 'white'}">${item.titulo}</strong><br>
                            <small>${item.series}x${item.reps} | ${item.tags[0]}</small>
                        </div>
                        <button onclick="delR(${i})" style="background:none; border:none; color:var(--danger)">✕</button>
                    </div>`;
            });
        }

        function analizarSobrecarga() {
            const box = document.getElementById('alertBox');
            const lumbares = rutina.filter(i => i.tags.join().toLowerCase().includes('lumbar')).length;
            if(lumbares > 2) {
                box.innerHTML = "⚠️ <strong>ALERTA DE FATIGA:</strong> Tienes " + lumbares + " ejercicios de zona Lumbar. Se recomienda cambiar uno por movilidad de cadera.";
                box.style.display = 'block';
            } else {
                box.innerHTML = "✅ <strong>BALANCE OK:</strong> Tu rutina es segura para hoy.";
                box.style.display = 'block'; box.style.borderColor = 'var(--accent)'; box.style.color = 'var(--accent)';
            }
        }

        function toggleDone(i) { rutina[i].done = !rutina[i].done; localStorage.setItem('mi_rutina', JSON.stringify(rutina)); renderRutina(); }
        function delR(i) { rutina.splice(i,1); localStorage.setItem('mi_rutina', JSON.stringify(rutina)); renderRutina(); }
        function borrarDB(i) { if(confirm("¿Eliminar de biblioteca?")) { db.splice(i,1); localStorage.setItem('dojo_db', JSON.stringify(db)); renderDB(); } }

        renderDB();
    </script>
</body>
                                           </html>
