<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Master Pro v9.9</title>
    <style>
        :root { --bg: #0b0e14; --card: #1c2128; --txt: #adbac7; --accent: #3fb950; --judo: #2f81f7; --danger: #f85149; --gold: #f1e05a; }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; padding: 10px; padding-bottom: 50px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #161b22; padding: 5px; border-radius: 12px; position: sticky; top: 10px; z-index: 100; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; background: transparent; color: var(--txt); font-weight: bold; font-size: 0.7em; cursor: pointer; }
        .tab-btn.active { background: var(--card); color: white; border: 1px solid var(--judo); }
        .panel { display: none; background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid #30363d; margin-bottom: 15px; }
        
        /* Video Player */
        .v-container { background: #000; border-radius: 12px; overflow: hidden; margin-top: 10px; position: relative; }
        video { width: 100%; display: block; max-height: 300px; }
        .v-bar { height: 8px; background: #333; width: 100%; cursor: pointer; position: relative; border-top: 1px solid #444; }
        .v-progress { height: 100%; background: var(--judo); width: 0%; pointer-events: none; }
        .v-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px; background: #161b22; }
        .v-btn { padding: 12px; background: #21262d; border: 1px solid #444; color: white; border-radius: 8px; font-size: 0.75em; font-weight: bold; }

        /* Tarjetas e Imágenes IA */
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #30363d; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-img { width: 100%; height: 200px; background: #000; object-fit: cover; }
        .card-body { padding: 15px; }
        .muscle-tag { color: var(--gold); font-size: 0.7em; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .agent { font-size: 0.82em; padding: 10px; border-radius: 8px; margin-top: 10px; border-left: 4px solid; line-height: 1.4; }
        .med { background: rgba(63, 185, 80, 0.08); border-color: var(--accent); color: #aff5b4; }
        .sensei { background: rgba(47, 129, 247, 0.08); border-color: var(--judo); color: #a5d6ff; }
        
        #timerDisplay { font-size: 4em; text-align: center; font-weight: 800; color: var(--accent); margin: 10px 0; font-family: monospace; }
        button.main { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-acc { background: var(--accent); color: white; }
        .routine-item { background: #0d1117; padding: 15px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        
        .alert-box { border-radius: 12px; padding: 15px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="sw('salud', this)">BIBLIOTECA</button>
        <button class="tab-btn" onclick="sw('rutina', this)">MI DÍA</button>
        <button class="tab-btn" onclick="sw('reloj', this)">RELOJ</button>
        <button class="tab-btn" onclick="sw('judo', this)">VIDEO 📹</button>
    </div>

    <div id="rutinaPanel" class="panel">
        <div id="rList"></div>
        <button class="main" style="background:var(--gold); color:black" onclick="analizarCerebro()">🧠 ANALIZAR SEGÚN ANSELMO</button>
        <div id="analysisResult" class="alert-box"></div>
    </div>

    <div id="judoPanel" class="panel">
        <input type="file" id="vIn" accept="video/*" style="width:100%; font-size:0.8em; margin-bottom:10px">
        <div class="v-container">
            <video id="vPl" playsinline></video>
            <div class="v-bar" id="progressBar" onclick="vSeekFunc(event)"><div id="vProgress" class="v-progress"></div></div>
        </div>
        <div style="text-align:center; font-size:0.7em; margin:8px 0; color:var(--txt)" id="vTime">00:00 / 00:00</div>
        <div class="v-controls">
            <button class="v-btn" onclick="vM(-5)">-5s</button>
            <button class="v-btn" id="vPlay" onclick="vT()">PLAY</button>
            <button class="v-btn" onclick="vM(5)">+5s</button>
            <button class="v-btn" style="background:var(--danger)" onclick="vStop()">STOP ⏹</button>
            <button class="v-btn" id="vSlow" onclick="vS()">0.5x</button>
            <button class="v-btn" onclick="vM(1)">+1s</button>
        </div>
    </div>

    <div id="relojPanel" class="panel">
        <div id="timerDisplay">00:20</div>
        <button class="main btn-acc" onclick="startT()">INICIAR</button>
        <button class="main" style="background:var(--danger); color:white" onclick="stopT()">PARAR</button>
    </div>

    <div id="content"></div>

    <button id="masterBtn" class="main" style="background:transparent; color:#333; font-size:0.65em; margin-top:30px" onclick="checkM()">[ Configuración ]</button>
    <div id="masterPanel" class="panel">
        <textarea id="jIn" rows="4" style="width:100%; background:#000; color:#fff; border-radius:8px; padding:8px"></textarea>
        <button class="main btn-acc" onclick="importJ()">IMPORTAR EJERCICIOS</button>
        <button class="main" style="background:var(--danger); color:white; margin-top:10px" onclick="logoutM()">CERRAR SESIÓN ADMIN</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('dojo_db')) || [];
        let rt = JSON.parse(localStorage.getItem('mi_rutina')) || [];
        let isMaster = localStorage.getItem('isMaster') === 'true';
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        const v = document.getElementById('vPl');

        function sw(t, b) {
            document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            if(document.getElementById(t+'Panel')) document.getElementById(t+'Panel').style.display = 'block';
            document.getElementById('content').style.display = t === 'salud' ? 'block' : 'none';
            t === 'salud' ? rDB() : (t === 'rutina' ? rRT() : null);
        }

        // Sonidos
        function playBeep(f, d) { 
            if(audio.state === 'suspended') audio.resume();
            const o=audio.createOscillator(), g=audio.createGain();
            o.connect(g); g.connect(audio.destination);
            o.frequency.value=f; g.gain.setValueAtTime(0.1, audio.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+d);
            o.start(); o.stop(audio.currentTime+d);
        }

        // Lógica Video
        document.getElementById('vIn').onchange = (e) => { if(e.target.files[0]) v.src = URL.createObjectURL(e.target.files[0]); };
        function vT() { v.paused ? (v.play(), vPlay.innerText="PAUSA") : (v.pause(), vPlay.innerText="PLAY"); }
        
        function vStop() { 
            v.pause(); 
            v.currentTime = 0; 
            vPlay.innerText="PLAY"; 
            playBeep(150, 0.5); // Sonido grave de parada
        }

        function vM(s) { v.currentTime += s; }
        function vS() { v.playbackRate = v.playbackRate === 1 ? 0.5 : 1; vSlow.innerText = v.playbackRate + "x"; }
        
        v.ontimeupdate = () => {
            const p = (v.currentTime / v.duration) * 100;
            document.getElementById('vProgress').style.width = p + "%";
            document.getElementById('vTime').innerText = fmt(v.currentTime) + " / " + fmt(v.duration);
        };
        function vSeekFunc(e) { v.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * v.duration; }
        function fmt(s) { if(isNaN(s)) return "00:00"; const m=Math.floor(s/60), r=Math.floor(s%60); return `${m.toString().padStart(2,'0')}:${r.toString().padStart(2,'0')}`; }

        // Cerebro Anselmo / Athlean-X
        function analizarCerebro() {
            const box = document.getElementById('analysisResult');
            box.style.display = 'block';
            const tags = rt.flatMap(x => x.tags.map(t => t.toLowerCase()));
            
            let med = "✅ Carga articular equilibrada.", sensei = "🥋 Postura de combate óptima.";
            let color = "rgba(63, 185, 80, 0.15)";

            const lumbarCount = tags.filter(t => t.includes('lumbar')).length;
            const empujeCount = tags.filter(t => t.includes('empuje')).length;
            const tracCount = tags.filter(t => t.includes('traccion')).length;

            if(lumbarCount > 2) {
                med = "⚠️ ALERTA ANSELMO: Demasiada compresión lumbar. Riesgo de inflamación discal. ¡Reduce volumen!";
                color = "rgba(248, 81, 73, 0.25)";
            }
            if(empujeCount > tracCount + 1) {
                sensei = "🚩 REGLA ATHLEAN-X: Desbalance detectado. Estás empujando más de lo que traccionas. ¡Añade remo!";
                color = "rgba(241, 224, 90, 0.25)";
            }

            box.style.background = color;
            box.style.border = "1px solid " + (color.includes('248') ? "var(--danger)" : "var(--gold)");
            box.innerHTML = `<div class="agent med">🦴 <strong>MÉDICO:</strong><br>${med}</div><div class="agent sensei">🎎 <strong>SENSEI:</strong><br>${sensei}</div>`;
        }

        // Render y Admin
        function checkM() { if(!isMaster && prompt("Pass:")==="JUDO2026") { localStorage.setItem('isMaster','true'); location.reload(); } else { masterPanel.style.display='block'; } }
        function logoutM() { localStorage.setItem('isMaster','false'); location.reload(); }
        function importJ() { try { db=[...db,...JSON.parse(jIn.value)]; localStorage.setItem('dojo_db',JSON.stringify(db)); rDB(); jIn.value=''; } catch(e){alert("Error JSON");} }

        function rDB() {
            const c = document.getElementById('content'); c.innerHTML = '';
            db.forEach((item, i) => {
                const img = `https://image.pollinations.ai/prompt/simple%20technical%20drawing%20exercise%20${item.titulo.replace(/ /g, '%20')}%20white%20background%20black%20lines?width=400&height=250&seed=${i+10}`;
                c.innerHTML += `
                    <div class="card">
                        <img src="${img}" class="card-img" alt="ejercicio">
                        <div class="card-body">
                            <span class="muscle-tag">📍 ${item.tags.join(' / ')}</span>
                            <h3 style="margin:0">${item.titulo}</h3>
                            <div class="agent med">🦴 <strong>Médico:</strong> ${item.consejo_medico}</div>
                            <div class="agent sensei">🎎 <strong>Sensei:</strong> ${item.aplicacion_judo}</div>
                            <button class="main btn-acc" onclick="addRT(${i})">+ AGREGAR A MI RUTA</button>
                            ${isMaster ? `<button onclick="delDB(${i})" style="color:var(--danger); background:none; border:none; margin-top:10px; width:100%; font-size:0.7em">[ BORRAR DE BASE ]</button>` : ''}
                        </div>
                    </div>`;
            });
        }

        function rRT() {
            const l = document.getElementById('rList'); l.innerHTML = rt.length ? '' : '<p style="text-align:center">No hay ejercicios hoy</p>';
            rt.forEach((x, i) => {
                l.innerHTML += `<div class="routine-item"><div onclick="tD(${i})" style="flex:1; cursor:pointer; opacity:${x.done?0.3:1}"><strong>${x.titulo}</strong></div><button onclick="delRT(${i})" style="background:none; border:none; color:var(--danger); font-size:1.2em">✕</button></div>`;
            });
        }

        function addRT(i) { if(rt.some(x=>x.titulo===db[i].titulo)) return; rt.push({...db[i], done:false}); localStorage.setItem('mi_rutina',JSON.stringify(rt)); }
        function tD(i){ rt[i].done=!rt[i].done; localStorage.setItem('mi_rutina',JSON.stringify(rt)); rRT(); }
        function delRT(i){ rt.splice(i,1); localStorage.setItem('mi_rutina',JSON.stringify(rt)); rRT(); }
        function delDB(i){ if(confirm("Borrar?")){db.splice(i,1); localStorage.setItem('dojo_db',JSON.stringify(db)); rDB();} }

        if(isMaster) { masterPanel.style.display = 'block'; masterBtn.innerText = "ADMIN MODE"; }
        rDB();
    </script>
</body>
</html>
